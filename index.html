<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>個人網站</title>
<meta name="description" content="個人作品集與自傳網站" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topnav">
  <div class="wrap">
    <div class="brand">~/portfolio<span class="dot">$</span></div>
    <nav>
      <a href="#about">自傳</a>
      <a href="#experience">經歷</a>
      <a href="#projects">作品</a>
      <a href="#contact">聯絡</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <div class="terminal">
        <div class="terminal-bar">
          <span class="tdot red"></span>
          <span class="tdot yellow"></span>
          <span class="tdot green"></span>
          <span class="tpath">bash — ~/portfolio</span>
        </div>
        <div class="terminal-body">
          <p class="terminal-line"><span class="prompt">$</span> whoami</p>
          <p class="terminal-line" id="whoami-output"></p>
          <div class="terminal-output" id="terminal-output">
            <h1 id="hero-name"></h1>
            <p class="title-en" id="hero-title-en"></p>
            <p class="tagline" id="hero-tagline"></p>
            <div class="meta" id="hero-meta"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="about">
    <div class="wrap">
      <div class="section-head">
        <span class="cmd">$ cat about.md</span>
        <h2>自傳</h2>
      </div>
      <div class="about-card" id="about-content"></div>

      <div class="section-head" style="margin-top:32px;">
        <span class="cmd">$ ls skills/</span>
        <h2>技能</h2>
      </div>
      <div class="skills" id="skills-list"></div>
    </div>
  </section>

  <section id="experience">
    <div class="wrap">
      <div class="section-head">
        <span class="cmd">$ git log --oneline</span>
        <h2>經歷</h2>
      </div>
      <div class="gitlog" id="gitlog"></div>
    </div>
  </section>

  <section id="projects">
    <div class="wrap">
      <div class="section-head">
        <span class="cmd">$ ls projects/</span>
        <h2>作品集</h2>
      </div>
      <div class="projects-grid" id="projects-grid"></div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <div class="section-head">
        <span class="cmd">$ cat contact.txt</span>
        <h2>聯絡我</h2>
      </div>
      <div class="contact-terminal">
        <p><span class="prompt">$</span> 歡迎透過以下方式聯絡我</p>
        <ul class="contact-list" id="contact-list"></ul>
      </div>
    </div>
  </section>
</main>

<footer>
  &copy; <span id="year"></span> · Built with HTML / CSS / JS · Deployed on GitHub Pages
</footer>

<script src="js/main.js"></script>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
